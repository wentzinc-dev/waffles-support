<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>21 Days V0.4</title><style>:root{color-scheme:dark;--panel:#171c25;--panel2:#212838;--line:#374154;--text:#f5f7fb;--muted:#aab5c3;--blue:#77d1ff;--good:#8be7a2;--bad:#ff7c91;--gold:#ffd76f}*{box-sizing:border-box}body{margin:0;background:#0b0e14;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:.4s}.wrap{max-width:780px;margin:auto;padding:14px 14px 28px}.head{display:flex;justify-content:space-between;align-items:end;gap:8px}.head h1{margin:0;font-size:24px}.sub{font-size:12px;color:var(--muted)}.timebar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}.time{border:1px solid #ffffff20;background:#ffffff08;border-radius:12px;padding:9px 4px;text-align:center;opacity:.42;transition:.35s}.time .ico{font-size:23px}.time b{display:block;font-size:12px;margin-top:2px}.time.active{opacity:1;transform:translateY(-1px);border-color:#ffffff80;box-shadow:0 0 18px #ffffff18}.time.done{opacity:.72}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}.stat{background:#161b24cc;border:1px solid var(--line);border-radius:11px;padding:8px 4px;text-align:center}.stat b{font-size:17px;display:block}.stat small{font-size:9px;color:var(--muted)}.scene{position:relative;overflow:hidden;border:1px solid #47546b;border-radius:18px;min-height:370px;transition:.5s;background:linear-gradient(#825f77 0%,#d89679 38%,#233143 39%,#172118 62%)}.celestial{position:absolute;right:8%;top:10%;width:72px;height:72px;border-radius:50%;background:#ffe0a3;box-shadow:0 0 35px #ffd89999;transition:.5s}.stars{position:absolute;inset:0 0 45% 0;opacity:0;transition:.4s;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:34px 34px}.skyLabel{position:absolute;right:12px;top:10px;font-size:12px;color:#fff9;background:#0004;padding:5px 8px;border-radius:99px}.castle{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:76%;height:190px}.wall{position:absolute;left:12%;right:12%;bottom:0;height:125px;background:linear-gradient(#5a5860,#373841);border:2px solid #77747c;border-radius:8px}.tower{position:absolute;bottom:0;width:25%;height:165px;background:linear-gradient(#62606a,#3c3d46);border:2px solid #7d7a84;border-radius:8px}.tower.l{left:0}.tower.r{right:0}.roof{position:absolute;left:-7%;right:-7%;top:-26px;height:30px;background:#242833;clip-path:polygon(50% 0,100% 100%,0 100%)}.gate{position:absolute;left:41%;bottom:0;width:18%;height:56px;background:#1c1b1d;border:2px solid #86828a;border-radius:30px 30px 0 0}.windows{position:absolute;inset:0}.window{position:absolute;width:10px;height:16px;background:#2b3442;border:1px solid #555;border-radius:5px 5px 2px 2px;transition:.4s}.w1{left:25%;top:88px}.w2{right:25%;top:100px}.w3{left:47%;top:76px}.barrierRing{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:84%;height:250px;border-radius:50%;border:3px solid #7ed9ff88;box-shadow:0 0 18px #7ed9ff66,inset 0 0 18px #7ed9ff22}.rooms{position:absolute;inset:0}.room{position:absolute;min-width:76px;padding:7px;border-radius:10px;border:1px solid #ffffff22;background:#111722d9;font-size:10px;text-align:center;backdrop-filter:blur(5px)}.room span{display:block;font-size:18px}.gateR{left:50%;bottom:18px;transform:translateX(-50%)}.garden{left:6%;bottom:82px}.study{left:27%;top:133px}.towerR{right:5%;top:94px}.restR{right:9%;bottom:74px}.princessR{left:40%;top:82px}.cannonR{right:28%;top:30px}.monsterField{position:absolute;left:0;right:0;bottom:2px;height:58px;display:flex;align-items:end;justify-content:center;gap:2px}.monster{font-size:21px;animation:bob 1.8s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-5px)}}.forecast{position:absolute;left:8px;top:8px;display:flex;gap:5px}.forecast div{background:#10151ccc;border:1px solid #ffffff1e;border-radius:8px;padding:5px 7px;font-size:10px}.forecast b{color:var(--gold);margin-left:3px}.panel{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}.resources{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.badge{background:var(--panel2);border-radius:999px;padding:5px 9px;font-size:11px;color:var(--blue)}.turnTitle{font-size:18px;font-weight:700;margin:2px 0 3px}.desc{font-size:13px;color:#dfe6ee;line-height:1.5}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}button{border:1px solid var(--line);background:#252e3c;color:white;padding:11px 10px;border-radius:11px;text-align:left;font-size:13px}button:disabled{opacity:.25}button small{display:block;color:#b8c3d0;margin-top:3px;font-size:10px}.fight{background:#173747}.special{background:#3a2845}.cannon{background:#423820}.log{max-height:150px;overflow:auto;background:#0f141b;border-radius:9px;padding:8px;margin-top:8px}.log div{font-size:11px;line-height:1.4;padding:5px 0;border-bottom:1px solid #242b36}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--gold)}.reset{width:100%;text-align:center;margin-top:10px}.phase-0 .scene{background:linear-gradient(#765a76 0%,#e7a47b 38%,#354458 39%,#172118 62%)}.phase-0 .celestial{background:#ffd9a0;right:12%;top:17%;box-shadow:0 0 35px #ffbc8199}.phase-1 .scene{background:linear-gradient(#63a9df 0%,#9ed5f5 38%,#40566d 39%,#1d2a1d 62%)}.phase-1 .celestial{background:#fff1a8;right:43%;top:7%;box-shadow:0 0 38px #fff0a0aa}.phase-2 .scene{background:linear-gradient(#5c466b 0%,#ca7163 38%,#30364a 39%,#182018 62%)}.phase-2 .celestial{background:#ffb06d;right:8%;top:24%;box-shadow:0 0 42px #ff8f6788}.phase-3 .scene{background:linear-gradient(#0d1732 0%,#17264b 38%,#1c2538 39%,#11180f 62%)}.phase-3 .celestial{background:#e7efff;right:12%;top:10%;box-shadow:0 0 42px #c8d8ff99}.phase-3 .stars{opacity:.72}.phase-2 .stars{opacity:.18}.phase-2 .window,.phase-3 .window{background:#ffd875;box-shadow:0 0 10px #ffda77}.phase-3{background:#05070d}.phase-2{background:#100b16}.phase-1{background:#172333}.phase-0{background:#241923}@media(max-width:560px){.scene{min-height:360px}.castle{width:87%}.room{min-width:68px;font-size:9px}.room span{font-size:17px}.stats{grid-template-columns:repeat(4,1fr)}.actions{grid-template-columns:1fr 1fr}}@media(min-width:650px){.stats{grid-template-columns:repeat(7,1fr)}}</style></head><body><div class="wrap"><div class="head"><div><h1>21 Days — V0.4</h1><div class="sub">朝・昼・夜・深夜を、城の空と時間帯バーで表示。</div></div><div id="bigPhase" style="font-size:28px">🌅</div></div><div class="timebar"><div class="time" data-p="0"><div class="ico">🌅</div><b>朝</b></div><div class="time" data-p="1"><div class="ico">☀️</div><b>昼</b></div><div class="time" data-p="2"><div class="ico">🌆</div><b>夜</b></div><div class="time" data-p="3"><div class="ico">🌙</div><b>深夜</b></div></div><div class="stats"><div class="stat"><b id="day">1</b><small>DAY</small></div><div class="stat"><b id="phase">朝</b><small>時間</small></div><div class="stat"><b id="hp">5/5</b><small>体力</small></div><div class="stat"><b id="barrier">5</b><small>結界</small></div><div class="stat"><b id="trust">0</b><small>信頼</small></div><div class="stat"><b id="memory">0</b><small>記憶</small></div><div class="stat"><b id="keys">0</b><small>鍵</small></div></div><div class="scene"><div class="stars"></div><div class="celestial"></div><div class="skyLabel" id="skyLabel">朝焼け</div><div class="forecast"><div>今日 <b id="f0">0</b></div><div>明日 <b id="f1">0</b></div><div>明後日 <b id="f2">0</b></div></div><div class="barrierRing"></div><div class="castle"><div class="tower l"><div class="roof"></div></div><div class="tower r"><div class="roof"></div></div><div class="wall"><div class="gate"></div></div><div class="windows"><i class="window w1"></i><i class="window w2"></i><i class="window w3"></i></div></div><div class="rooms"><div class="room gateR"><span>⚔️</span>城門</div><div class="room garden"><span>🌿</span>庭</div><div class="room study"><span>📚</span>古書室</div><div class="room towerR"><span>🔭</span>監視塔</div><div class="room restR"><span>🛏</span>自室</div><div class="room princessR"><span>👑</span>姫の部屋</div><div class="room cannonR"><span>💥</span>大砲</div></div><div class="monsterField" id="monsterField"></div></div><div class="panel"><div class="resources"><span class="badge" id="monsters">👹 0</span><span class="badge" id="princess">👑 0/8</span><span class="badge" id="keyBadge">🗝 0</span><span class="badge" id="memoryBadge">✦ 0/3</span></div><div class="turnTitle" id="title">Day 1 / 朝</div><div class="desc" id="desc"></div><div class="actions"><button class="fight" data-a="fight"><b>⚔️ 城門で討伐</b><small>残体力分だけ撃破</small></button><button data-a="train"><b>🌿 庭で鍛錬</b><small>体力-3 / 上限+1</small></button><button data-a="study"><b>📚 古書室で座学</b><small>朝昼 / 体力-2 / 結界+1 / 信頼+1</small></button><button data-a="tower"><b>🔭 監視塔へ</b><small>体力-1 / 記憶+1</small></button><button data-a="rest"><b>🛏 自室で休憩</b><small>体力+5</small></button><button class="special" data-a="princess"><b>👑 姫の部屋</b><small>深夜 / 魔物0 / 鍵1 / 体力-3</small></button><button class="cannon" data-a="cannon"><b>💥 大砲を撃つ</b><small>深夜 / 鍵1 / 最大5体撃破</small></button></div><div class="log" id="log"></div></div><button class="reset" id="reset">最初からやり直す</button></div><script>(()=>{"use strict";const arrivals=[0,1,0,3,3,5,0,3,5,7,0,3,5,0,3,8,9,9,8,9,12],phases=["朝","昼","夜","深夜"],icons=["🌅","☀️","🌆","🌙"],labels=["朝焼け","真昼","夕暮れ","深夜"],$=x=>document.getElementById(x);let s;function log(t,c=""){let d=document.createElement("div");d.className=c;d.textContent=t;$("log").prepend(d)}function gainTrust(n){let o=Math.floor(s.trust/5);s.trust+=n;let q=Math.floor(s.trust/5);if(q>o){s.keys+=q-o;log(`信頼${s.trust}。鍵×${q-o}獲得！`,"good")}}function addMemory(){s.memory++;if(s.memory>=3){s.memory-=3;gainTrust(1);log("記憶3つ → 信頼+1。","good")}}function reset(){s={day:1,phase:0,hp:5,max:5,barrier:5,trust:0,memory:0,keys:0,monsters:arrivals[0],princess:0,ended:false};$("log").innerHTML="";log("Day 1開始。");render()}function finish(){if(s.phase===3){if(s.monsters>0){s.barrier-=s.monsters;log(`深夜判定：結界-${s.monsters}。`,`bad`)}else log("深夜判定：魔物0。","good");if(s.barrier<=0){s.barrier=0;s.ended=true;render();return}if(s.day===21){s.ended=true;render();return}s.day++;s.phase=0;s.monsters+=arrivals[s.day-1];log(`Day ${s.day}。魔物${arrivals[s.day-1]}体到達。`,arrivals[s.day-1]?"warn":"")}else s.phase++;render()}function act(a){if(s.ended)return;if(s.hp===0&&a!=="rest")return log("体力0。休憩のみ可能。","bad");if(a==="fight"){if(!s.monsters)return log("魔物はいない。");let k=Math.min(s.hp,s.monsters);s.hp-=k;s.monsters-=k;log(`${k}体討伐。残存${s.monsters}。`,`good`)}else if(a==="train"){if(s.hp<3)return log("体力3が必要。","bad");s.hp-=3;s.max++;log(`体力上限→${s.max}。`,`good`)}else if(a==="study"){if(s.phase>1||s.hp<2)return log("座学できない。","bad");s.hp-=2;s.barrier++;gainTrust(1);log("結界+1 / 信頼+1。","good")}else if(a==="tower"){if(s.hp<1)return log("体力1が必要。","bad");s.hp--;addMemory();log("記憶+1。")}else if(a==="rest"){s.hp=Math.min(s.max,s.hp+5);log("休憩。","good")}else if(a==="princess"){if(s.phase!==3||s.monsters||s.keys<1||s.hp<3)return log("姫の部屋の条件不足。","bad");s.keys--;s.hp-=3;s.barrier+=5;s.princess++;log(`姫の部屋 ${s.princess}/8。`,`good`)}else if(a==="cannon"){if(s.phase!==3||s.keys<1)return log("大砲の条件不足。","bad");s.keys--;let k=Math.min(5,s.monsters);s.monsters-=k;log(`大砲で${k}体撃破。`,`good`)}finish()}function render(){document.body.className=`phase-${s.phase}`;$("day").textContent=s.day;$("phase").textContent=phases[s.phase];$("bigPhase").textContent=icons[s.phase];$("skyLabel").textContent=labels[s.phase];$("hp").textContent=`${s.hp}/${s.max}`;$("barrier").textContent=s.barrier;$("trust").textContent=s.trust;$("memory").textContent=s.memory;$("keys").textContent=s.keys;$("monsters").textContent=`👹 ${s.monsters}`;$("princess").textContent=`👑 ${s.princess}/8`;$("keyBadge").textContent=`🗝 ${s.keys}`;$("memoryBadge").textContent=`✦ ${s.memory}/3`;for(let i=0;i<3;i++)$(`f${i}`).textContent=s.day-1+i<21?arrivals[s.day-1+i]:"—";document.querySelectorAll(".time").forEach((e,i)=>{e.classList.toggle("active",i===s.phase);e.classList.toggle("done",i<s.phase)});$("title").textContent=s.ended?"RESULT":`Day ${s.day} / ${phases[s.phase]}`;$("desc").textContent=s.ended?(s.barrier<=0?"GAME OVER":s.monsters===0?(s.princess>=8?"TRUE END":"NORMAL END"):"GAME OVER"):`残存魔物 ${s.monsters}体。${s.phase===3?"この行動後に深夜の結界判定。":"行動すると時間が進む。"}`;$("monsterField").innerHTML="";for(let i=0;i<Math.min(s.monsters,16);i++){let m=document.createElement("span");m.className="monster";m.textContent="👹";$("monsterField").appendChild(m)}document.querySelectorAll("[data-a]").forEach(b=>{let a=b.dataset.a,dis=s.ended;if(s.hp===0&&a!=="rest")dis=true;if(a==="study"&&s.phase>1)dis=true;if((a==="princess"||a==="cannon")&&s.phase!==3)dis=true;if(a==="princess"&&(s.monsters||s.keys<1||s.hp<3))dis=true;if(a==="cannon"&&s.keys<1)dis=true;b.disabled=dis})}document.querySelectorAll("[data-a]").forEach(b=>b.addEventListener("click",()=>act(b.dataset.a)));$("reset").addEventListener("click",reset);reset()})();</script></body></html>
