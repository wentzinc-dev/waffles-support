<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>21 Days Prototype</title>
<style>
:root{color-scheme:dark;--bg:#0f1218;--panel:#191f29;--panel2:#222a37;--line:#364052;--text:#f3f6fa;--muted:#a8b2c0;--accent:#7dd3fc;--good:#86efac;--bad:#fb7185;--warn:#fde68a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#0d1015,#151b24);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.top{margin-bottom:14px}h1{font-size:26px;margin:0 0 4px}.sub{color:var(--muted);font-size:14px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:12px}.stat{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px 5px;text-align:center}.stat b{display:block;font-size:18px}.stat small{font-size:10px;color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:12px}.badges{display:flex;gap:7px;flex-wrap:wrap}.badge{background:var(--panel2);border-radius:999px;padding:5px 9px;font-size:12px;color:var(--accent)}h2{font-size:21px;margin:14px 0 7px}p{line-height:1.6;color:#dce4ee;margin:0}.actions{display:grid;gap:9px;margin-top:15px}button{width:100%;border:1px solid var(--line);background:#273140;color:white;padding:14px;border-radius:12px;font-size:15px;text-align:left;-webkit-tap-highlight-color:transparent}button:active{transform:scale(.99);background:#303b4c}button small{color:#b9c3ce}.primary{background:#17394a;border-color:#2c6179}.log{max-height:280px;overflow:auto;background:#10151c;border-radius:10px;padding:9px}.log div{font-size:13px;line-height:1.5;padding:7px 2px;border-bottom:1px solid #252d39}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.reset{text-align:center;background:#202733}@media(max-width:520px){.stats{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h1>21 Days — Prototype</h1><div class="sub">21日目の深夜まで、結界を1以上残せ。</div></div>
<div class="stats"><div class="stat"><b id="day">1</b><small>DAY</small></div><div class="stat"><b id="phase">朝</b><small>時間帯</small></div><div class="stat"><b id="hp">5/5</b><small>体力</small></div><div class="stat"><b id="barrier">5</b><small>結界</small></div><div class="stat"><b id="trust">0</b><small>ミア信頼</small></div></div>
<div class="card"><div class="badges"><span class="badge" id="monsters">城門の魔物 0</span><span class="badge" id="intel">情報 0</span></div><h2 id="title">Day 1 / 朝</h2><p id="desc">まだ城は静かだ。限られた時間を何に使う？</p><div class="actions"><button data-act="rest"><b>休息する</b><br><small>体力 +2</small></button><button data-act="talk"><b>ミアと話す</b><br><small>信頼度 +1 / 情報を得ることがある</small></button><button data-act="scout"><b>周辺を調査する</b><br><small>体力 -1 / 襲撃を先回りで防げることがある</small></button><button class="primary" data-act="fight"><b>城門の魔物を討伐</b><br><small>魔物1体につき体力 -1</small></button></div></div>
<div class="card"><h2 style="margin-top:0">記録</h2><div class="log" id="log"></div></div>
<button class="reset" id="reset">最初からやり直す</button>
</div>
<script>
(()=>{"use strict";const phases=["朝","昼","夜","深夜"],$=id=>document.getElementById(id);let s;function log(t,c=""){const d=document.createElement("div");d.className=c;d.textContent=t;$("log").prepend(d)}function reset(){s={day:1,phase:0,hp:5,max:5,barrier:5,trust:0,monsters:0,intel:0,ended:false,eastKnown:false,eastPrevented:false,basementKnown:false,basementPrevented:false};$("log").innerHTML="";log("Day 1。21日間、城を守り抜け。");render()}function startEvent(){if(s.ended)return;if(s.day===4&&s.phase===2&&!s.basementKnown)log("地下室から妙な物音がした……。","warn");if(s.day===8&&s.phase===0&&!s.eastPrevented){s.monsters+=3;log("東側から魔物3体が城門へ到達した！","bad")}if(s.day===14&&s.phase===1&&!s.basementPrevented){s.monsters+=2;log("地下から魔物2体が侵入した！","bad")}if(s.day===18&&s.phase===2){s.monsters+=2;log("夜襲！ 魔物2体が城門へ到達した。","bad")}}function advance(){if(s.phase===3){if(s.monsters>0){const d=s.monsters;s.barrier-=d;log(`未討伐の魔物${d}体により結界 -${d}。`,"bad")}else log("今日の結界ダメージは0。","good");if(s.barrier<=0){s.barrier=0;s.ended=true;log(`Day ${s.day}：結界が崩壊した。GAME OVER。`,"bad");render();return}if(s.day===21){s.ended=true;log(`21日間を耐え抜いた！ 結界残量 ${s.barrier}。CLEAR！`,"good");render();return}s.day++;s.phase=0;s.hp=Math.min(s.max,s.hp+1);log(`Day ${s.day}開始。睡眠で体力 +1。`);startEvent()}else{s.phase++;startEvent()}render()}function act(a){if(s.ended)return;if(a==="rest"){const b=s.hp;s.hp=Math.min(s.max,s.hp+2);log(`休息した。体力 ${b} → ${s.hp}`);advance();return}if(a==="talk"){s.trust++;log(`ミアと話した。信頼度 +1 → ${s.trust}`,"good");if(s.trust===2&&!s.eastKnown){s.eastKnown=true;s.intel++;log("ミア『東の森で妙な気配を感じるの』—— 東側の襲撃情報を得た。","good")}if(s.trust===4&&!s.basementKnown){s.basementKnown=true;s.intel++;log("ミア『地下室の壁の向こうから音がする』—— 地下侵入の情報を得た。","good")}advance();return}if(a==="scout"){if(s.hp<1){log("体力が足りない。","bad");return}s.hp--;let found=false;if(s.day<=7&&s.eastKnown&&!s.eastPrevented){s.eastPrevented=true;found=true;log("東の森で魔物の群れを発見し、進路を封鎖した。Day 8の襲撃を阻止！","good")}if(s.day<=13&&s.basementKnown&&!s.basementPrevented){s.basementPrevented=true;found=true;log("地下の侵入口を発見して塞いだ。Day 14の侵入を阻止！","good")}if(!found)log("周辺を調査したが、大きな異常は見つからなかった。");advance();return}if(a==="fight"){if(s.monsters===0){log("城門に魔物はいない。");return}if(s.hp===0){log("体力がないため討伐できない。","bad");return}const k=Math.min(s.hp,s.monsters);s.hp-=k;s.monsters-=k;log(`魔物を${k}体討伐。体力 -${k}。残り${s.monsters}体。`,"good");advance()}}function render(){$("day").textContent=s.day;$("phase").textContent=phases[s.phase];$("hp").textContent=`${s.hp}/${s.max}`;$("barrier").textContent=s.barrier;$("trust").textContent=s.trust;$("monsters").textContent=`城門の魔物 ${s.monsters}`;$("intel").textContent=`情報 ${s.intel}`;$("title").textContent=s.ended?(s.barrier>0?"ゲームクリア":"ゲームオーバー"):`Day ${s.day} / ${phases[s.phase]}`;$("desc").textContent=s.ended?(s.barrier>0?`21日間を耐え抜いた。結界残量 ${s.barrier}。`:"城の結界は崩壊した。"):s.monsters>0?`城門に魔物が${s.monsters}体いる。深夜を終えると結界が削られる。何を優先する？`:s.hp<=1?"かなり疲れている。休むか、それでも情報を取りに行くか。":"まだ城は静かだ。限られた時間を何に使う？";document.querySelectorAll("[data-act]").forEach(b=>b.disabled=s.ended)}document.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>act(b.dataset.act)));$("reset").addEventListener("click",reset);reset()})();
</script>
</body></html>
