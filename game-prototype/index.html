<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>21 Days V0.3</title><style>:root{color-scheme:dark;--bg1:#141822;--bg2:#0b0e14;--panel:#171c25;--panel2:#212838;--line:#374154;--text:#f5f7fb;--muted:#aab5c3;--blue:#77d1ff;--good:#8be7a2;--bad:#ff7c91;--gold:#ffd76f}*{box-sizing:border-box}body{margin:0;background:linear-gradient(var(--bg1),var(--bg2));color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:.35s}.wrap{max-width:780px;margin:auto;padding:14px 14px 26px}.head{display:flex;align-items:end;justify-content:space-between;gap:10px}.head h1{margin:0;font-size:24px}.sub{font-size:12px;color:var(--muted)}.phaseSun{font-size:28px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:11px 0}.stat{background:#161b24cc;border:1px solid var(--line);border-radius:11px;padding:8px 4px;text-align:center}.stat b{font-size:17px;display:block}.stat small{font-size:9px;color:var(--muted)}.scene{position:relative;overflow:hidden;border:1px solid #47546b;border-radius:18px;min-height:360px;background:linear-gradient(#23324a 0 42%,#182335 42% 58%,#172118 58%);box-shadow:inset 0 0 50px #0008}.moonGlow{position:absolute;width:130px;height:130px;border-radius:50%;right:-25px;top:-38px;background:#e8efff18;box-shadow:0 0 45px #b8ceff18}.skyline{position:absolute;inset:auto 0 40% 0;height:50px;background:linear-gradient(135deg,transparent 15%,#121823 16% 24%,transparent 25%) 0 0/70px 50px repeat-x;opacity:.7}.castle{position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);width:72%;height:190px}.wall{position:absolute;left:12%;right:12%;bottom:0;height:125px;background:linear-gradient(#5a5860,#373841);border:2px solid #77747c;border-radius:8px 8px 4px 4px;box-shadow:inset 0 0 30px #0008}.tower{position:absolute;bottom:0;width:25%;height:165px;background:linear-gradient(#62606a,#3c3d46);border:2px solid #7d7a84;border-radius:8px 8px 4px 4px}.tower.l{left:0}.tower.r{right:0}.roof{position:absolute;left:-7%;right:-7%;top:-26px;height:30px;background:#242833;clip-path:polygon(50% 0,100% 100%,0 100%)}.gate{position:absolute;left:41%;bottom:0;width:18%;height:56px;background:#1c1b1d;border:2px solid #86828a;border-radius:30px 30px 0 0}.barrierRing{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);width:82%;height:245px;border-radius:50%;border:3px solid #7ed9ff88;box-shadow:0 0 18px #7ed9ff66,inset 0 0 18px #7ed9ff22;pointer-events:none}.rooms{position:absolute;inset:0}.room{position:absolute;min-width:84px;padding:7px 8px;border-radius:10px;border:1px solid #ffffff22;background:#111722d9;font-size:11px;text-align:center;backdrop-filter:blur(5px);box-shadow:0 5px 14px #0006}.room span{display:block;font-size:20px;margin-bottom:1px}.room.gateR{left:50%;bottom:18px;transform:translateX(-50%)}.room.garden{left:7%;bottom:78px}.room.study{left:27%;top:123px}.room.towerR{right:5%;top:88px}.room.restR{right:10%;bottom:70px}.room.princessR{left:40%;top:72px}.room.cannonR{right:29%;top:22px}.monsterField{position:absolute;left:0;right:0;bottom:2px;height:58px;display:flex;align-items:end;justify-content:center;gap:2px;pointer-events:none}.monster{font-size:21px;filter:drop-shadow(0 2px 4px #000);animation:bob 1.8s ease-in-out infinite alternate}.monster:nth-child(even){animation-delay:.4s}@keyframes bob{to{transform:translateY(-5px)}}.forecast{position:absolute;left:8px;top:8px;display:flex;gap:5px}.forecast div{background:#10151ccc;border:1px solid #ffffff1e;border-radius:8px;padding:5px 7px;font-size:10px}.forecast b{color:var(--gold);margin-left:3px}.panel{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}.resources{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.badge{background:var(--panel2);border-radius:999px;padding:5px 9px;font-size:11px;color:var(--blue)}.turnTitle{font-size:18px;font-weight:700;margin:2px 0 3px}.desc{font-size:13px;color:#dfe6ee;line-height:1.5}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}button{border:1px solid var(--line);background:#252e3c;color:white;padding:11px 10px;border-radius:11px;text-align:left;font-size:13px;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.25}button small{display:block;color:#b8c3d0;margin-top:3px;font-size:10px}.fight{background:#173747}.special{background:#3a2845}.cannon{background:#423820}.log{max-height:165px;overflow:auto;background:#0f141b;border-radius:9px;padding:8px;margin-top:8px}.log div{font-size:11px;line-height:1.4;padding:5px 0;border-bottom:1px solid #242b36}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--gold)}.reset{width:100%;text-align:center;margin-top:10px}.night{--bg1:#0b1020;--bg2:#05070d}.deepnight{--bg1:#070914;--bg2:#020309}.daytime{--bg1:#344764;--bg2:#131a24}.morning{--bg1:#5b5366;--bg2:#19202b}@media(max-width:560px){.castle{width:86%}.scene{min-height:355px}.room{min-width:72px;font-size:10px}.room span{font-size:18px}.actions{grid-template-columns:1fr 1fr}.stat:nth-child(n+5){display:none}}@media(min-width:650px){.stats{grid-template-columns:repeat(7,1fr)}} </style></head><body><div class="wrap"><div class="head"><div><h1>21 Days — V0.3</h1><div class="sub">城を守り、21日目の深夜に魔物を0へ。</div></div><div class="phaseSun" id="phaseIcon">🌅</div></div><div class="stats"><div class="stat"><b id="day">1</b><small>DAY</small></div><div class="stat"><b id="phase">朝</b><small>時間</small></div><div class="stat"><b id="hp">5/5</b><small>体力</small></div><div class="stat"><b id="barrier">5</b><small>結界</small></div><div class="stat"><b id="trust">0</b><small>信頼</small></div><div class="stat"><b id="memory">0</b><small>記憶</small></div><div class="stat"><b id="keys">0</b><small>鍵</small></div></div><div class="scene"><div class="moonGlow"></div><div class="skyline"></div><div class="forecast"><div>今日 <b id="f0">0</b></div><div>明日 <b id="f1">0</b></div><div>明後日 <b id="f2">0</b></div></div><div class="barrierRing" id="ring"></div><div class="castle"><div class="tower l"><div class="roof"></div></div><div class="tower r"><div class="roof"></div></div><div class="wall"><div class="gate"></div></div></div><div class="rooms"><div class="room gateR"><span>⚔️</span>城門</div><div class="room garden"><span>🌿</span>庭</div><div class="room study"><span>📚</span>古書室</div><div class="room towerR"><span>🔭</span>監視塔</div><div class="room restR"><span>🛏</span>自室</div><div class="room princessR"><span>👑</span>姫の部屋</div><div class="room cannonR"><span>💥</span>大砲</div></div><div class="monsterField" id="monsterField"></div></div><div class="panel"><div class="resources"><span class="badge" id="monsters">👹 0</span><span class="badge" id="princess">👑 0/8</span><span class="badge" id="keyBadge">🗝 0</span><span class="badge" id="memoryBadge">✦ 0/3</span></div><div class="turnTitle" id="title">Day 1 / 朝</div><div class="desc" id="desc"></div><div class="actions"><button class="fight" data-a="fight"><b>⚔️ 城門で討伐</b><small>残体力分だけ撃破</small></button><button data-a="train"><b>🌿 庭で鍛錬</b><small>体力-3 / 上限+1</small></button><button data-a="study"><b>📚 古書室で座学</b><small>朝昼 / 体力-2 / 結界+1 / 信頼+1</small></button><button data-a="tower"><b>🔭 監視塔へ</b><small>体力-1 / 記憶+1</small></button><button data-a="rest"><b>🛏 自室で休憩</b><small>体力+5</small></button><button class="special" data-a="princess"><b>👑 姫の部屋</b><small>深夜 / 魔物0 / 鍵1 / 体力-3</small></button><button class="cannon" data-a="cannon"><b>💥 大砲を撃つ</b><small>深夜 / 鍵1 / 最大5体撃破</small></button></div><div class="log" id="log"></div></div><button class="reset" id="reset">最初からやり直す</button></div><script>(()=>{"use strict";const arrivals=[0,1,0,3,3,5,0,3,5,7,0,3,5,0,3,8,9,9,8,9,12],phases=["朝","昼","夜","深夜"],icons=["🌅","☀️","🌆","🌙"],classes=["morning","daytime","night","deepnight"],$=x=>document.getElementById(x);let s;function log(t,c=""){let d=document.createElement("div");d.className=c;d.textContent=t;$("log").prepend(d)}function gainTrust(n){let old=Math.floor(s.trust/5);s.trust+=n;let now=Math.floor(s.trust/5);if(now>old){let k=now-old;s.keys+=k;log(`信頼${s.trust}。鍵×${k}を獲得！`,"good")}}function addMemory(n){s.memory+=n;while(s.memory>=3){s.memory-=3;gainTrust(1);log("記憶の欠片3つ → 信頼+1。","good")}}function reset(){s={day:1,phase:0,hp:5,max:5,barrier:5,trust:0,memory:0,keys:0,monsters:arrivals[0],princess:0,ended:false};$("log").innerHTML="";log(`Day 1開始。魔物${arrivals[0]}体が到達。`);render()}function finishTurn(){if(s.phase===3){if(s.monsters>0){s.barrier-=s.monsters;log(`深夜：魔物${s.monsters}体 → 結界-${s.monsters}。`,"bad")}else log("深夜：魔物0。結界は無傷。","good");if(s.barrier<=0){s.barrier=0;s.ended=true;log("結界崩壊。GAME OVER。","bad");render();return}if(s.day===21){s.ended=true;if(s.monsters===0)log(s.princess>=8?"TRUE END":"NORMAL END","good");else log(`魔物${s.monsters}体が残った。GAME OVER。`,`bad`);render();return}s.day++;s.phase=0;s.monsters+=arrivals[s.day-1];log(`Day ${s.day}。魔物${arrivals[s.day-1]}体到達。残存${s.monsters}。`,arrivals[s.day-1]?"warn":"")}else s.phase++;render()}function act(a){if(s.ended)return;if(s.hp===0&&a!=="rest"){log("体力0。自室で休むしかない。","bad");return}if(a==="fight"){if(!s.monsters){log("城門に魔物はいない。");return}let k=Math.min(s.hp,s.monsters);s.hp-=k;s.monsters-=k;log(`討伐！ ${k}体撃破。残存${s.monsters}。`,"good")}else if(a==="train"){if(s.hp<3){log("鍛錬には体力3が必要。","bad");return}s.hp-=3;s.max++;log(`鍛錬。体力上限→${s.max}。`,"good")}else if(a==="study"){if(s.phase>1){log("座学は朝・昼のみ。","bad");return}if(s.hp<2){log("体力2が必要。","bad");return}s.hp-=2;s.barrier++;gainTrust(1);log("座学。結界+1 / 信頼+1。","good")}else if(a==="tower"){if(s.hp<1){log("体力1が必要。","bad");return}s.hp--;addMemory(1);log("監視塔。記憶の欠片+1。")}else if(a==="rest"){let o=s.hp;s.hp=Math.min(s.max,s.hp+5);log(`休憩。体力${o}→${s.hp}。`,`good`)}else if(a==="princess"){if(s.phase!==3||s.monsters||s.keys<1||s.hp<3){log("姫の部屋の条件を満たしていない。","bad");return}s.keys--;s.hp-=3;s.barrier+=5;s.princess++;log(`姫の部屋。結界+5。(${s.princess}/8)`,`good`)}else if(a==="cannon"){if(s.phase!==3||s.keys<1){log("大砲の条件を満たしていない。","bad");return}s.keys--;let k=Math.min(5,s.monsters);s.monsters-=k;log(`大砲！ 魔物${k}体撃破。`,`good`)}finishTurn()}function monstersVisual(){let n=Math.min(s.monsters,12),h="";for(let i=0;i<n;i++)h+='<span class="monster">👹</span>';if(s.monsters>12)h+=`<span class="monster">+${s.monsters-12}</span>`;$("monsterField").innerHTML=h}function render(){document.body.className=classes[s.phase];$("phaseIcon").textContent=icons[s.phase];$("day").textContent=s.day;$("phase").textContent=phases[s.phase];$("hp").textContent=`${s.hp}/${s.max}`;$("barrier").textContent=s.barrier;$("trust").textContent=s.trust;$("memory").textContent=s.memory;$("keys").textContent=s.keys;$("monsters").textContent=`👹 ${s.monsters}`;$("princess").textContent=`👑 ${s.princess}/8`;$("keyBadge").textContent=`🗝 ${s.keys}`;$("memoryBadge").textContent=`✦ ${s.memory}/3`;for(let i=0;i<3;i++)$(`f${i}`).textContent=s.day-1+i<21?arrivals[s.day-1+i]:"—";$("ring").style.opacity=Math.max(.15,Math.min(1,s.barrier/5));$("ring").style.borderColor=s.barrier<=2?"#ff7c9188":"#7ed9ff88";monstersVisual();$("title").textContent=s.ended?"RESULT":`Day ${s.day} / ${phases[s.phase]}`;$("desc").innerHTML=s.ended?(s.barrier<=0?'<b class="bad">GAME OVER</b>':s.day===21&&s.monsters===0?`<b class="good">${s.princess>=8?"TRUE END":"NORMAL END"}</b>`:'<b class="bad">GAME OVER</b>'):`城門前に <b>${s.monsters}</b> 体。${s.phase===3?"この行動後、結界判定。":"行動を1つ選ぶと時間が進む。"}`;document.querySelectorAll("[data-a]").forEach(b=>{let a=b.dataset.a,dis=s.ended;if(s.hp===0&&a!=="rest")dis=true;if(a==="study"&&s.phase>1)dis=true;if((a==="princess"||a==="cannon")&&s.phase!==3)dis=true;if(a==="princess"&&(s.monsters||s.keys<1||s.hp<3))dis=true;if(a==="cannon"&&s.keys<1)dis=true;b.disabled=dis})}document.querySelectorAll("[data-a]").forEach(b=>b.addEventListener("click",()=>act(b.dataset.a)));$("reset").addEventListener("click",reset);reset()})();</script></body></html>
