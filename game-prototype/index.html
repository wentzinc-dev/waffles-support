<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>21 Days V0.2</title><style>:root{color-scheme:dark;--p:#191f29;--p2:#222a37;--l:#364052;--t:#f3f6fa;--m:#a8b2c0;--a:#7dd3fc;--g:#86efac;--b:#fb7185;--w:#fde68a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#0d1015,#151b24);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:16px}h1{font-size:25px;margin:0}.sub,.hint{color:var(--m);font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:13px 0}.stat,.card{background:var(--p);border:1px solid var(--l);border-radius:13px}.stat{padding:9px 4px;text-align:center}.stat b{display:block;font-size:18px}.stat small{font-size:10px;color:var(--m)}.card{padding:14px;margin-bottom:11px}.forecast{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.forecast div{background:var(--p2);padding:8px;border-radius:9px;text-align:center;font-size:12px}.forecast b{display:block;font-size:19px}.resources{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.badge{background:var(--p2);border-radius:99px;padding:5px 9px;font-size:12px;color:var(--a)}h2{font-size:20px;margin:8px 0}p{line-height:1.55;margin:0}.actions{display:grid;gap:8px;margin-top:12px}button{width:100%;border:1px solid var(--l);background:#273140;color:white;padding:13px;border-radius:11px;font-size:14px;text-align:left;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.3}button small{color:#b9c3ce}.special{background:#3b2946}.cannon{background:#3e3522}.fight{background:#17394a}.log{max-height:260px;overflow:auto;background:#10151c;border-radius:9px;padding:8px}.log div{font-size:12px;line-height:1.45;padding:6px 2px;border-bottom:1px solid #252d39}.good{color:var(--g)}.bad{color:var(--b)}.warn{color:var(--w)}.end{font-size:20px;font-weight:700}.reset{text-align:center}@media(min-width:650px){.actions{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(7,1fr)}}</style></head><body><div class="wrap"><h1>21 Days — V0.2</h1><div class="sub">21日目の深夜終了時、魔物を0体にせよ。</div><div class="stats"><div class="stat"><b id="day">1</b><small>DAY</small></div><div class="stat"><b id="phase">朝</b><small>時間</small></div><div class="stat"><b id="hp">5/5</b><small>体力</small></div><div class="stat"><b id="barrier">5</b><small>結界</small></div><div class="stat"><b id="trust">0</b><small>信頼</small></div><div class="stat"><b id="memory">0</b><small>記憶</small></div><div class="stat"><b id="keys">0</b><small>鍵</small></div></div><div class="card"><div class="hint">魔物到達予定</div><div class="forecast"><div>今日<b id="f0">0</b></div><div>明日<b id="f1">0</b></div><div>明後日<b id="f2">0</b></div></div><div class="resources"><span class="badge" id="monsters">残存魔物 0</span><span class="badge" id="princess">姫の部屋 0/8</span></div><h2 id="title">Day 1 / 朝</h2><p id="desc"></p><div class="actions"><button class="fight" data-a="fight"><b>⚔️ 城門：討伐</b><br><small>残体力分だけ魔物を倒す / 体力＝討伐数消費</small></button><button data-a="train"><b>🏋️ 庭：鍛錬</b><br><small>体力-3 / 体力上限+1</small></button><button data-a="study"><b>📚 古書室：座学</b><br><small>朝・昼のみ / 体力-2 / 結界+1 / 信頼+1</small></button><button data-a="tower"><b>🔭 監視塔</b><br><small>体力-1 / 記憶の欠片+1（3で信頼+1）</small></button><button data-a="rest"><b>🛏 自室：休憩</b><br><small>体力+5 / 体力消費なし</small></button><button class="special" data-a="princess"><b>👑 姫の部屋</b><br><small>深夜のみ / 魔物0 / 鍵1 / 体力-3 → 結界+5</small></button><button class="cannon" data-a="cannon"><b>💥 大砲の部屋</b><br><small>深夜のみ / 鍵1 → 魔物を最大5体撃破</small></button></div></div><div class="card"><h2 style="margin-top:0">記録</h2><div class="log" id="log"></div></div><button class="reset" id="reset">最初からやり直す</button></div><script>(()=>{"use strict";const arrivals=[0,1,0,3,3,5,0,3,5,7,0,3,5,0,3,8,9,9,8,9,12],phases=["朝","昼","夜","深夜"],$=x=>document.getElementById(x);let s;function log(t,c=""){let d=document.createElement("div");d.className=c;d.textContent=t;$("log").prepend(d)}function gainTrust(n){let old=Math.floor(s.trust/5);s.trust+=n;let now=Math.floor(s.trust/5);if(now>old){let k=now-old;s.keys+=k;log(`信頼が${s.trust}に到達。鍵×${k}を獲得！`,"good")}}function addMemory(n){s.memory+=n;while(s.memory>=3){s.memory-=3;gainTrust(1);log("記憶の欠片3つが揃い、信頼+1。","good")}}function reset(){s={day:1,phase:0,hp:5,max:5,barrier:5,trust:0,memory:0,keys:0,monsters:arrivals[0],princess:0,ended:false};$("log").innerHTML="";log(`Day 1開始。魔物${arrivals[0]}体が到達。`);render()}function finishTurn(){if(s.phase===3){if(s.monsters>0){s.barrier-=s.monsters;log(`深夜判定：残存魔物${s.monsters}体 → 結界-${s.monsters}。`,"bad")}else log("深夜判定：魔物0。結界へのダメージなし。","good");if(s.barrier<=0){s.barrier=0;s.ended=true;log("結界が0になった。GAME OVER。","bad");render();return}if(s.day===21){s.ended=true;if(s.monsters===0){let trueEnd=s.princess>=8;log(trueEnd?"TRUE END：姫の部屋へ8回到達し、21日間を守り切った！":"NORMAL END：21日間を守り切った！","good")}else log(`21日目終了時に魔物が${s.monsters}体残った。GAME OVER。`,"bad");render();return}s.day++;s.phase=0;s.monsters+=arrivals[s.day-1];log(`Day ${s.day}開始。魔物${arrivals[s.day-1]}体が到達。残存${s.monsters}体。`,arrivals[s.day-1]?"warn":"")}else s.phase++;render()}function act(a){if(s.ended)return;if(s.hp===0&&a!=="rest"){log("体力0。自室で休憩するしかない。","bad");return}if(a==="fight"){if(s.monsters===0){log("討伐対象の魔物がいない。");return}let k=Math.min(s.hp,s.monsters);s.hp-=k;s.monsters-=k;log(`魔物${k}体を討伐。体力-${k}。残存${s.monsters}体。`,"good")}else if(a==="train"){if(s.hp<3){log("鍛錬には体力3が必要。","bad");return}s.hp-=3;s.max++;log(`鍛錬。体力-3、体力上限 ${s.max-1}→${s.max}。`,"good")}else if(a==="study"){if(s.phase>1){log("古書室の座学は朝・昼のみ。","bad");return}if(s.hp<2){log("座学には体力2が必要。","bad");return}s.hp-=2;s.barrier++;gainTrust(1);log("座学。体力-2 / 結界+1 / 信頼+1。","good")}else if(a==="tower"){if(s.hp<1){log("監視塔には体力1が必要。","bad");return}s.hp--;addMemory(1);log("監視塔。体力-1 / 記憶の欠片+1。")}else if(a==="rest"){let old=s.hp;s.hp=Math.min(s.max,s.hp+5);log(`自室で休憩。体力 ${old}→${s.hp}。`,"good")}else if(a==="princess"){if(s.phase!==3){log("姫の部屋へ行けるのは深夜のみ。","bad");return}if(s.monsters!==0){log("魔物が残っているため姫の部屋へ行けない。","bad");return}if(s.keys<1){log("鍵がない。","bad");return}if(s.hp<3){log("姫の部屋には体力3が必要。","bad");return}s.keys--;s.hp-=3;s.barrier+=5;s.princess++;log(`姫の部屋へ到達。鍵-1 / 体力-3 / 結界+5。(${s.princess}/8)`,"good")}else if(a==="cannon"){if(s.phase!==3){log("大砲を使えるのは深夜のみ。","bad");return}if(s.keys<1){log("鍵がない。","bad");return}s.keys--;let k=Math.min(5,s.monsters);s.monsters-=k;log(`大砲発射！ 鍵-1 / 魔物${k}体撃破。残存${s.monsters}体。`,"good")}finishTurn()}function render(){$("day").textContent=s.day;$("phase").textContent=phases[s.phase];$("hp").textContent=`${s.hp}/${s.max}`;$("barrier").textContent=s.barrier;$("trust").textContent=s.trust;$("memory").textContent=s.memory;$("keys").textContent=s.keys;$("monsters").textContent=`残存魔物 ${s.monsters}`;$("princess").textContent=`姫の部屋 ${s.princess}/8`;for(let i=0;i<3;i++)$(`f${i}`).textContent=(s.day-1+i<21)?arrivals[s.day-1+i]:"—";$("title").textContent=s.ended?"RESULT":`Day ${s.day} / ${phases[s.phase]}`;$("desc").innerHTML=s.ended?(s.barrier<=0?'<span class="end bad">GAME OVER</span>':s.day===21&&s.monsters===0?`<span class="end good">${s.princess>=8?"TRUE END":"NORMAL END"}</span>`:'<span class="end bad">GAME OVER</span>'):`残存魔物 <b>${s.monsters}</b>体。${s.phase===3?"この行動後に結界判定が発生する。":"行動を1つ選ぶと次の時間帯へ進む。"}`;document.querySelectorAll("[data-a]").forEach(b=>{let a=b.dataset.a,dis=s.ended;if(s.hp===0&&a!=="rest")dis=true;if(a==="study"&&s.phase>1)dis=true;if((a==="princess"||a==="cannon")&&s.phase!==3)dis=true;if(a==="princess"&&(s.monsters!==0||s.keys<1||s.hp<3))dis=true;if(a==="cannon"&&s.keys<1)dis=true;b.disabled=dis})}document.querySelectorAll("[data-a]").forEach(b=>b.addEventListener("click",()=>act(b.dataset.a)));$("reset").addEventListener("click",reset);reset()})();</script></body></html>
