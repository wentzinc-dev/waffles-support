<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>21 Days V0.5</title><style>:root{color-scheme:dark;--panel:#171c25;--p2:#212838;--line:#374154;--text:#f5f7fb;--muted:#aab5c3;--blue:#77d1ff;--good:#8be7a2;--bad:#ff7c91;--gold:#ffd76f}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#5b5366,#19202b);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:.35s}.wrap{max-width:780px;margin:auto;padding:14px 14px 28px}h1{margin:0;font-size:24px}.sub{font-size:12px;color:var(--muted)}.timebar{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:12px 0 8px}.time{background:#151a23aa;border:1px solid #ffffff22;border-radius:11px;padding:7px 3px;text-align:center;font-size:10px;opacity:.45;transition:.25s}.time i{display:block;font-style:normal;font-size:20px}.time.active{opacity:1;border-color:#fff9;box-shadow:0 0 16px #fff3;transform:translateY(-2px)}.headstats{display:grid;grid-template-columns:1fr 1fr;gap:7px}.meter{background:#151a23d9;border:1px solid var(--line);border-radius:12px;padding:9px}.meterTop{display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px}.segments{display:flex;gap:3px;flex-wrap:wrap}.seg{width:15px;height:10px;border-radius:3px;background:#ffffff14;border:1px solid #ffffff1a}.hp .seg.on{background:#ff6f87;border-color:#ff9aaa;box-shadow:0 0 6px #ff668855}.shield .seg.on{background:#69d6ff;border-color:#a5e8ff;box-shadow:0 0 7px #65d9ff66}.mini{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.badge{background:#151a23d9;border:1px solid #ffffff18;border-radius:99px;padding:5px 9px;font-size:11px;color:var(--blue)}.scene{position:relative;overflow:hidden;border:1px solid #47546b;border-radius:17px;min-height:245px;background:linear-gradient(#c77f72 0 45%,#68546a 45% 60%,#172118 60%);box-shadow:inset 0 0 50px #0008;transition:.35s}.celestial{position:absolute;right:25px;top:28px;font-size:42px}.castle{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:70%;height:130px}.wall{position:absolute;left:12%;right:12%;bottom:0;height:88px;background:#464750;border:2px solid #77747c;border-radius:7px}.tower{position:absolute;bottom:0;width:25%;height:120px;background:#555761;border:2px solid #7d7a84;border-radius:7px}.tower.l{left:0}.tower.r{right:0}.roof{position:absolute;left:-8%;right:-8%;top:-22px;height:25px;background:#242833;clip-path:polygon(50% 0,100% 100%,0 100%)}.gate{position:absolute;left:42%;bottom:0;width:16%;height:42px;background:#17191d;border-radius:22px 22px 0 0}.ring{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:83%;height:178px;border:3px solid #75dfff;box-shadow:0 0 17px #6edcff88,inset 0 0 15px #6edcff22;border-radius:50%;transition:.3s}.monsters{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:20px;letter-spacing:-4px;filter:drop-shadow(0 2px 3px #000)}.forecast{position:absolute;left:7px;top:7px;display:flex;gap:4px}.forecast div{background:#10151cdd;border-radius:7px;padding:4px 6px;font-size:9px}.forecast b{color:var(--gold)}.panel{margin-top:9px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}.title{font-size:18px;font-weight:700}.desc{font-size:12px;color:#dfe6ee;margin-top:3px;line-height:1.45}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}button{border:1px solid var(--line);background:#252e3c;color:white;padding:11px 9px;border-radius:10px;text-align:left;font-size:12px}button small{display:block;color:#b8c3d0;font-size:9px;margin-top:3px}button:disabled{opacity:.25}.fight{background:#173747}.special{background:#3a2845}.cannon{background:#423820}.log{max-height:145px;overflow:auto;background:#0f141b;border-radius:9px;padding:7px;margin-top:8px}.log div{font-size:10px;padding:4px 0;border-bottom:1px solid #242b36}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--gold)}.reset{width:100%;text-align:center;margin-top:9px}.daytime .scene{background:linear-gradient(#70b9df 0 47%,#c8d9d0 47% 60%,#1e311e 60%)}.evening .scene{background:linear-gradient(#d07468 0 45%,#513e58 45% 60%,#19231b 60%)}.deepnight .scene{background:linear-gradient(#071126 0 48%,#15172a 48% 60%,#101a15 60%)}.deepnight{background:linear-gradient(#070914,#020309)}.evening{background:linear-gradient(#25172a,#0b0d14)}.daytime{background:linear-gradient(#385f77,#17212b)}@media(max-width:520px){.castle{width:84%}.actions{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><h1>21 Days — V0.5</h1><div class="sub">育つ体力、育つ結界。21日目の深夜に魔物を0へ。</div><div class="timebar"><div class="time" id="t0"><i>🌅</i>朝</div><div class="time" id="t1"><i>☀️</i>昼</div><div class="time" id="t2"><i>🌆</i>夜</div><div class="time" id="t3"><i>🌙</i>深夜</div></div><div class="headstats"><div class="meter hp"><div class="meterTop"><b>♥ 体力</b><span id="hpText">5/5</span></div><div class="segments" id="hpSeg"></div></div><div class="meter shield"><div class="meterTop"><b>◆ 結界</b><span id="shieldText">1/5</span></div><div class="segments" id="shieldSeg"></div></div></div><div class="mini"><span class="badge" id="dayBadge">DAY 1</span><span class="badge" id="trustBadge">🤝 信頼 0</span><span class="badge" id="keyBadge">🗝 0</span><span class="badge" id="memoryBadge">✦ 0/3</span><span class="badge" id="killBadge">⚔️ 討伐 0</span><span class="badge" id="princessBadge">👑 0/8</span></div><div class="scene"><div class="celestial" id="celestial">🌅</div><div class="forecast"><div>今日 <b id="f0">1</b></div><div>明日 <b id="f1">1</b></div><div>明後日 <b id="f2">0</b></div></div><div class="ring" id="ring"></div><div class="castle"><div class="tower l"><div class="roof"></div></div><div class="tower r"><div class="roof"></div></div><div class="wall"><div class="gate"></div></div></div><div class="monsters" id="monsterField"></div></div><div class="panel"><div class="title" id="title"></div><div class="desc" id="desc"></div><div class="actions"><button class="fight" data-a="fight"><b>⚔️ 城門：討伐</b><small>倒した数だけ体力消費 / 10体ごと信頼+1</small></button><button data-a="train"><b>🌿 庭：鍛錬</b><small>体力-3 / 最大体力+1</small></button><button data-a="study"><b>📚 古書室：座学</b><small>朝昼 / 体力-2 / 結界+1 / 信頼+1</small></button><button data-a="tower"><b>🔭 監視塔</b><small>体力-1 / 記憶+1</small></button><button data-a="rest"><b>🛏 自室：休憩</b><small>体力+5</small></button><button class="special" data-a="princess"><b>👑 姫の部屋</b><small>深夜 / 魔物0 / 鍵1 / 体力-3 → 結界上限+3＆全回復</small></button><button class="cannon" data-a="cannon"><b>💥 大砲</b><small>深夜 / 鍵1 / 最大5体撃破</small></button></div><div class="log" id="log"></div></div><button class="reset" id="reset">最初からやり直す</button></div><script>(()=>{"use strict";const A=[1,1,0,3,3,5,0,3,5,7,0,3,5,0,3,8,9,9,8,9,12],P=["朝","昼","夜","深夜"],I=["🌅","☀️","🌆","🌙"],$=x=>document.getElementById(x);let s;function log(t,c=""){let d=document.createElement("div");d.className=c;d.textContent=t;$("log").prepend(d)}function trust(n){let o=Math.floor(s.trust/5);s.trust+=n;let q=Math.floor(s.trust/5);if(q>o){s.keys+=q-o;log(`信頼${s.trust}：鍵×${q-o}獲得！`,"good")}}function mem(){s.memory++;if(s.memory>=3){s.memory-=3;trust(1);log("記憶の欠片3 → 信頼+1。","good")}}function killed(n){let o=Math.floor(s.kills/10);s.kills+=n;let q=Math.floor(s.kills/10);if(q>o){trust(q-o);log(`累計討伐${s.kills}体：信頼+${q-o}！`,"good")}}function reset(){s={day:1,phase:0,hp:5,maxHp:5,shield:1,maxShield:5,trust:0,memory:0,keys:0,kills:0,monsters:A[0],princess:0,ended:false};$("log").innerHTML="";log("Day 1開始。魔物1体がすでに城門へ到達している。","warn");render()}function endTurn(){if(s.phase===3){if(s.monsters){s.shield-=s.monsters;log(`深夜：魔物${s.monsters}体 → 結界-${s.monsters}。`,`bad`)}else log("深夜：魔物0。結界は無傷。","good");if(s.shield<=0){s.shield=0;s.ended=true;log("結界崩壊。GAME OVER。","bad");render();return}if(s.day===21){s.ended=true;if(!s.monsters)log(s.princess>=8?"TRUE END":"NORMAL END","good");else log("21日目に魔物が残った。GAME OVER。","bad");render();return}s.shield=Math.min(s.maxShield,s.shield+1);log(`夜明け：結界が1回復 → ${s.shield}/${s.maxShield}。`,`good`);s.day++;s.phase=0;s.monsters+=A[s.day-1];log(`Day ${s.day}：魔物${A[s.day-1]}体到達。残存${s.monsters}。`,A[s.day-1]?"warn":"")}else s.phase++;render()}function act(a){if(s.ended)return;if(s.hp===0&&a!=="rest"){log("体力0。自室で休むしかない。","bad");return}if(a==="fight"){if(!s.monsters){log("魔物はいない。");return}let k=Math.min(s.hp,s.monsters);s.hp-=k;s.monsters-=k;killed(k);log(`${k}体討伐。残存${s.monsters}。`,`good`)}else if(a==="train"){if(s.hp<3){log("体力3が必要。","bad");return}s.hp-=3;s.maxHp++;log(`鍛錬：最大体力→${s.maxHp}。`,`good`)}else if(a==="study"){if(s.phase>1||s.hp<2){log("座学できない。朝昼・体力2が必要。","bad");return}s.hp-=2;s.shield=Math.min(s.maxShield,s.shield+1);trust(1);log("座学：結界+1 / 信頼+1。","good")}else if(a==="tower"){if(s.hp<1){log("体力1が必要。","bad");return}s.hp--;mem();log("監視塔：記憶+1。")}else if(a==="rest"){let o=s.hp;s.hp=Math.min(s.maxHp,s.hp+5);log(`休憩：体力${o}→${s.hp}。`,`good`)}else if(a==="princess"){if(s.phase!==3||s.monsters||s.keys<1||s.hp<3){log("姫の部屋の条件を満たしていない。","bad");return}s.keys--;s.hp-=3;s.maxShield+=3;s.shield=s.maxShield;s.princess++;log(`姫の部屋：結界上限+3＆全回復 → ${s.shield}/${s.maxShield}。`,`good`)}else if(a==="cannon"){if(s.phase!==3||s.keys<1){log("大砲の条件を満たしていない。","bad");return}s.keys--;let k=Math.min(5,s.monsters);s.monsters-=k;killed(k);log(`大砲：${k}体撃破。残存${s.monsters}。`,`good`)}endTurn()}function seg(id,n,max){let e=$(id);e.innerHTML="";for(let i=0;i<max;i++){let d=document.createElement("span");d.className="seg"+(i<n?" on":"");e.appendChild(d)}}function render(){document.body.className=s.phase===1?"daytime":s.phase===2?"evening":s.phase===3?"deepnight":"";for(let i=0;i<4;i++)$(`t${i}`).classList.toggle("active",i===s.phase);$("celestial").textContent=I[s.phase];$("hpText").textContent=`${s.hp}/${s.maxHp}`;$("shieldText").textContent=`${s.shield}/${s.maxShield}`;seg("hpSeg",s.hp,s.maxHp);seg("shieldSeg",s.shield,s.maxShield);$("dayBadge").textContent=`DAY ${s.day}`;$("trustBadge").textContent=`🤝 信頼 ${s.trust}`;$("keyBadge").textContent=`🗝 ${s.keys}`;$("memoryBadge").textContent=`✦ ${s.memory}/3`;$("killBadge").textContent=`⚔️ 討伐 ${s.kills}`;$("princessBadge").textContent=`👑 ${s.princess}/8`;for(let i=0;i<3;i++)$(`f${i}`).textContent=s.day-1+i<21?A[s.day-1+i]:"—";$("monsterField").textContent="👹".repeat(Math.min(s.monsters,18))+(s.monsters>18?` +${s.monsters-18}`:"");$("ring").style.opacity=Math.max(.18,s.shield/s.maxShield);$("title").textContent=s.ended?"RESULT":`Day ${s.day} / ${P[s.phase]}`;$("desc").textContent=s.ended?(s.shield<=0?"GAME OVER":(!s.monsters?(s.princess>=8?"TRUE END":"NORMAL END"):"GAME OVER")):`残存魔物 ${s.monsters}体。${s.phase===3?"この行動後に結界判定。":"行動を1つ選ぶと時間が進む。"}`;document.querySelectorAll("[data-a]").forEach(b=>{let a=b.dataset.a,d=s.ended||(s.hp===0&&a!=="rest")||(a==="study"&&(s.phase>1||s.hp<2))||(a==="train"&&s.hp<3)||(a==="tower"&&s.hp<1)||((a==="princess"||a==="cannon")&&s.phase!==3)||(a==="princess"&&(s.monsters||s.keys<1||s.hp<3))||(a==="cannon"&&s.keys<1);b.disabled=d})}document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>act(b.dataset.a));$("reset").onclick=reset;reset()})();</script></body></html>
