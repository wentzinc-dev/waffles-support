<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>21 Days V0.12</title><style>:root{color-scheme:dark;--p:#171c25;--l:#374154;--m:#aab5c3;--g:#8be7a2;--b:#ff7c91;--gold:#ffd76f}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#5b5366,#19202b);color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:780px;margin:auto;padding:14px 14px 28px}h1{margin:0;font-size:24px}.sub{font-size:12px;color:var(--m)}.timebar{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:12px 0 8px}.time{background:#151a23aa;border:1px solid #ffffff22;border-radius:11px;padding:7px 3px;text-align:center;font-size:10px;opacity:.45}.time i{display:block;font-style:normal;font-size:20px}.time.active{opacity:1;border-color:#fff9;box-shadow:0 0 16px #fff3;transform:translateY(-2px)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}.meter{background:#151a23d9;border:1px solid var(--l);border-radius:12px;padding:9px}.mt{display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px}.segments{display:flex;gap:3px;flex-wrap:wrap}.seg{width:15px;height:10px;border-radius:3px;background:#ffffff14}.ap .on{background:#ffd45f}.shield .on{background:#69d6ff}.mini{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.badge{background:#151a23d9;border:1px solid #ffffff18;border-radius:99px;padding:5px 9px;font-size:11px;color:#77d1ff}.scene{position:relative;overflow:hidden;border:1px solid #47546b;border-radius:17px;min-height:245px;background:linear-gradient(#c77f72 0 45%,#68546a 45% 60%,#172118 60%)}.celestial{position:absolute;right:25px;top:28px;font-size:42px}.castle{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:70%;height:130px}.wall{position:absolute;left:12%;right:12%;bottom:0;height:88px;background:#464750;border:2px solid #77747c}.tower{position:absolute;bottom:0;width:25%;height:120px;background:#555761;border:2px solid #7d7a84}.tower.l{left:0}.tower.r{right:0}.roof{position:absolute;left:-8%;right:-8%;top:-22px;height:25px;background:#242833;clip-path:polygon(50% 0,100% 100%,0 100%)}.gate{position:absolute;left:42%;bottom:0;width:16%;height:42px;background:#17191d;border-radius:22px 22px 0 0}.ring{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:83%;height:178px;border:3px solid #75dfff;box-shadow:0 0 17px #6edcff88;border-radius:50%}.monsters{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:20px;letter-spacing:-4px}.forecast{position:absolute;left:7px;top:7px;display:flex;gap:4px}.forecast div{background:#10151cdd;border-radius:7px;padding:4px 6px;font-size:9px}.forecast b{color:var(--gold)}.scout{display:none;margin-top:8px;background:#10151c;border:1px solid #35536b;border-radius:10px;padding:8px}.scout.show{display:block}.scoutGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:5px}.scoutGrid div{text-align:center;background:#1e2936;border-radius:6px;padding:5px 1px;font-size:8px}.scoutGrid b{display:block;font-size:13px;color:var(--gold)}.panel{margin-top:9px;background:var(--p);border:1px solid var(--l);border-radius:14px;padding:12px}.title{font-size:18px;font-weight:700}.desc{font-size:12px;color:#dfe6ee;margin-top:3px}.nextHit{margin-top:7px;background:#321b24;border:1px solid #743347;border-radius:8px;padding:7px;font-size:11px;color:#ffb0bd}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}button{border:1px solid var(--l);background:#252e3c;color:white;padding:11px 9px;border-radius:10px;text-align:left;font-size:12px}button small{display:block;color:#b8c3d0;font-size:9px;margin-top:3px}button:disabled{opacity:.25}.fight{background:#173747}.special{background:#3a2845}.cannon{background:#423820}.stroll{background:#283c32}.log{max-height:145px;overflow:auto;background:#0f141b;border-radius:9px;padding:7px;margin-top:8px}.log div{font-size:10px;padding:4px 0;border-bottom:1px solid #242b36}.good{color:var(--g)}.bad{color:var(--b)}.warn{color:var(--gold)}.reset{width:100%;text-align:center;margin-top:9px}.daytime .scene{background:linear-gradient(#70b9df 0 47%,#c8d9d0 47% 60%,#1e311e 60%)}.evening .scene{background:linear-gradient(#d07468 0 45%,#513e58 45% 60%,#19231b 60%)}.deepnight .scene{background:linear-gradient(#071126 0 48%,#15172a 48% 60%,#101a15 60%)}.deepnight{background:linear-gradient(#070914,#020309)}.evening{background:linear-gradient(#25172a,#0b0d14)}.daytime{background:linear-gradient(#385f77,#17212b)}@media(max-width:520px){.castle{width:84%}}</style></head><body><div class="wrap"><h1>21 Days — V0.12</h1><div class="sub">姫の部屋は信頼だけを消費。APは消費しない。</div><div class="timebar"><div class="time" id="t0"><i>🌅</i>朝</div><div class="time" id="t1"><i>☀️</i>昼</div><div class="time" id="t2"><i>🌆</i>夜</div><div class="time" id="t3"><i>🌙</i>深夜</div></div><div class="stats"><div class="meter ap"><div class="mt"><b>⚡ AP</b><span id="apText"></span></div><div class="segments" id="apSeg"></div></div><div class="meter shield"><div class="mt"><b>◆ 結界</b><span id="shieldText"></span></div><div class="segments" id="shieldSeg"></div></div></div><div class="mini"><span class="badge" id="dayBadge"></span><span class="badge" id="trustBadge"></span><span class="badge" id="killBadge"></span><span class="badge" id="princessBadge"></span><span class="badge" id="cannonBadge"></span><span class="badge" id="strollBadge"></span></div><div class="scene"><div class="celestial" id="celestial">🌅</div><div class="forecast"><div>今日 <b id="f0"></b></div><div>明日 <b id="f1"></b></div><div>明後日 <b id="f2"></b></div></div><div class="ring" id="ring"></div><div class="castle"><div class="tower l"><div class="roof"></div></div><div class="tower r"><div class="roof"></div></div><div class="wall"><div class="gate"></div></div></div><div class="monsters" id="monsterField"></div></div><div class="scout" id="scout"><b>🔭 監視塔：7日間の到達予測</b><div class="scoutGrid" id="scoutGrid"></div></div><div class="panel"><div class="title" id="title"></div><div class="desc" id="desc"></div><div class="nextHit" id="nextHit"></div><div class="actions"><button class="fight" data-a="fight"><b>⚔️ 城門：討伐</b><small>1体につきAP-1 / 10体ごと信頼+1</small></button><button data-a="train"><b>🌿 庭：鍛錬</b><small>AP-2 / 最大AP+1</small></button><button data-a="study"><b>📚 古書室</b><small>朝昼 / AP-3 / 結界+1 / 信頼+1</small></button><button data-a="tower"><b>🔭 監視塔：偵察</b><small>AP-1 / 7日予報</small></button><button data-a="rest"><b>🛏 自室：休憩</b><small>AP+8（最大まで）</small></button><button class="stroll" data-a="stroll"><b>🚶 城を散策</b><small>AP消費なし / 1ターン / イベント発生用</small></button><button class="special" data-a="princess"><b>👑 姫の部屋</b><small>深夜 / 信頼-4 / AP消費なし → 結界上限+2＆全回復</small></button><button class="cannon" data-a="cannon"><b>💥 大砲</b><small>深夜 / 消費なし / 最大10体撃破 / 全2回</small></button></div><div class="log" id="log"></div></div><button class="reset" id="reset">最初からやり直す</button></div><script>(()=>{"use strict";const A=[1,1,0,3,3,9,0,3,5,13,0,3,9,0,3,13,9,8,7,8,12],P=["朝","昼","夜","深夜"],I=["🌅","☀️","🌆","🌙"],$=x=>document.getElementById(x);let s;const strollEvents=["回廊で使用人たちの噂話を耳にした。","中庭で姫の姿を遠くに見かけた。","古い肖像画の裏に小さな傷跡を見つけた。","兵士たちが城門の様子について話している。","誰もいない廊下に、かすかな足音が響いた。"];function log(t,c=""){let d=document.createElement("div");d.className=c;d.textContent=t;$("log").prepend(d)}function gainTrust(n){s.trust+=n}function addKills(n){let a=Math.floor(s.kills/10);s.kills+=n;let b=Math.floor(s.kills/10);if(b>a){gainTrust(b-a);log(`累計討伐${s.kills}体：信頼+${b-a}。`,`good`)}}function attack(){let d=s.monsters;if(d){s.shield=Math.max(0,s.shield-d);log(`夜襲：残存魔物${d}体 → 結界-${d}。現在${s.shield}/${s.maxShield}。`,s.shield===0?"bad":"warn")}else log("夜襲：魔物0。被害なし。","good")}function reset(){s={day:1,phase:0,ap:5,maxAp:5,shield:1,maxShield:5,trust:0,kills:0,monsters:A[0],princess:0,cannonUses:0,strolls:0,ended:false,scouted:false};$("log").innerHTML="";log("Day 1：魔物1体到着。深夜までに対処できる。","warn");render()}function finishNight(){if(s.shield===0){s.ended=true;log("結界0のまま深夜終了。GAME OVER。","bad");render();return}if(s.day===21){s.ended=true;log(s.monsters===0?(s.princess>=8?"TRUE END":"NORMAL END"):"GAME OVER",s.monsters===0?"good":"bad");render();return}s.shield=Math.min(s.maxShield,s.shield+1);log(`深夜終了：結界自然回復+1 → ${s.shield}/${s.maxShield}。`,`good`);s.day++;s.phase=0;s.monsters+=A[s.day-1];log(`Day ${s.day}：魔物${A[s.day-1]}体到着。城門に${s.monsters}体。`,A[s.day-1]?"warn":"");render()}function endTurn(){s.scouted=false;if(s.phase===2){attack();s.phase=3;render()}else if(s.phase===3)finishNight();else{s.phase++;render()}}function act(a){if(s.ended)return;if(s.ap===0&&!['rest','stroll','cannon','princess'].includes(a)){log("AP0。休憩が必要。","bad");return}if(a==='fight'){if(!s.monsters){log("魔物はいない。");return}let k=Math.min(s.ap,s.monsters);s.ap-=k;s.monsters-=k;addKills(k);log(`${k}体討伐。残存${s.monsters}。`,`good`)}else if(a==='train'){if(s.ap<2)return log("AP2が必要。","bad");s.ap-=2;s.maxAp++;log(`最大AP→${s.maxAp}。`,`good`)}else if(a==='study'){if(s.phase>1||s.ap<3)return log("古書室は朝昼・AP3が必要。","bad");s.ap-=3;s.shield=Math.min(s.maxShield,s.shield+1);gainTrust(1);log("古書室：結界+1 / 信頼+1。","good")}else if(a==='tower'){if(s.ap<1)return log("AP1が必要。","bad");s.ap--;s.scouted=true;log("7日間を偵察。","good")}else if(a==='rest'){let o=s.ap;s.ap=Math.min(s.maxAp,s.ap+8);log(`休憩：AP ${o}→${s.ap}。`,`good`)}else if(a==='stroll'){s.strolls++;let ev=strollEvents[(s.day+s.phase+s.strolls)%strollEvents.length];log(`城を散策：${ev}`,"good")}else if(a==='princess'){if(s.phase!==3||s.trust<4)return log("姫の部屋には深夜・信頼4が必要。","bad");s.trust-=4;s.maxShield+=2;s.shield=s.maxShield;s.princess++;log(`姫：信頼-4。結界上限+2＆全回復 → ${s.shield}/${s.maxShield}。`,`good`)}else if(a==='cannon'){if(s.phase!==3)return log("大砲は深夜のみ。","bad");if(s.cannonUses>=2)return log("大砲はもう使い切った。","bad");s.cannonUses++;let k=Math.min(10,s.monsters);s.monsters-=k;addKills(k);log(`大砲：${k}体撃破。残存${s.monsters}。残り${2-s.cannonUses}回。`,`good`)}endTurn()}function seg(id,n,max){let e=$(id);e.innerHTML="";for(let i=0;i<max;i++){let d=document.createElement("span");d.className="seg"+(i<n?" on":"");e.appendChild(d)}}function scout(){let e=$("scoutGrid");e.innerHTML="";for(let i=0;i<7;i++){let x=s.day-1+i,d=document.createElement("div");d.innerHTML=x<21?`D${x+1}<b>${A[x]}</b>`:`—<b>—</b>`;e.appendChild(d)}}function render(){document.body.className=s.phase===1?"daytime":s.phase===2?"evening":s.phase===3?"deepnight":"";for(let i=0;i<4;i++)$(`t${i}`).classList.toggle("active",i===s.phase);$("celestial").textContent=I[s.phase];$("apText").textContent=`${s.ap}/${s.maxAp}`;$("shieldText").textContent=`${s.shield}/${s.maxShield}`;seg("apSeg",s.ap,s.maxAp);seg("shieldSeg",s.shield,s.maxShield);$("dayBadge").textContent=`DAY ${s.day}`;$("trustBadge").textContent=`🤝 信頼 ${s.trust}`;$("killBadge").textContent=`⚔️ 討伐 ${s.kills}`;$("princessBadge").textContent=`👑 ${s.princess}/8`;$("cannonBadge").textContent=`💥 大砲 ${2-s.cannonUses}/2`;$("strollBadge").textContent=`🚶 散策 ${s.strolls}`;for(let i=0;i<3;i++)$(`f${i}`).textContent=s.day-1+i<21?A[s.day-1+i]:"—";$("monsterField").textContent="👹".repeat(Math.min(s.monsters,18))+(s.monsters>18?` +${s.monsters-18}`:"");$("ring").style.opacity=s.shield===0?.08:Math.max(.18,s.shield/s.maxShield);$("scout").classList.toggle("show",s.scouted);if(s.scouted)scout();$("title").textContent=s.ended?"RESULT":`Day ${s.day} / ${P[s.phase]}`;$("nextHit").style.display=s.ended?"none":"block";$("nextHit").textContent=s.phase<3?`🌙 今夜の攻撃予測：残存${s.monsters}体 → 結界-${s.monsters}`:`🌙 夜襲終了。結界${s.shield}/${s.maxShield}。深夜の行動を選択。`;$("desc").textContent=s.ended?(s.monsters===0&&s.shield>0?(s.princess>=8?"TRUE END":"NORMAL END"):"GAME OVER"):(s.phase===3&&s.shield===0?"⚠️ 結界0。姫の部屋で復旧しなければ、この深夜終了時にGAME OVER。":`城門に魔物${s.monsters}体。朝・昼・夜で減らし、残った魔物が深夜直前に攻撃する。`);document.querySelectorAll("[data-a]").forEach(b=>{let a=b.dataset.a,d=s.ended||(s.ap===0&&!['rest','stroll','cannon','princess'].includes(a))||(a==='study'&&(s.phase>1||s.ap<3))||(a==='train'&&s.ap<2)||(a==='tower'&&s.ap<1)||((a==='princess'||a==='cannon')&&s.phase!==3)||(a==='princess'&&s.trust<4)||(a==='cannon'&&s.cannonUses>=2);b.disabled=d})}document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>act(b.dataset.a));$("reset").onclick=reset;reset()})();</script></body></html>
